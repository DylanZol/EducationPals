[project]
name = "educationpals-course-takehome"
version = "0.1.0"
description = "Reproducible AI course-generation pipeline for the EducationPals take-home"
requires-python = "==3.12.*"
dependencies = [
  "openai==3.12.0",
  "pydantic==2.13.5",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
